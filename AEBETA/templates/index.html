<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE 5900 Remote Cockpit</title>
    <style>
        body {
            background: #0a0a0a;
            color: #dcdcdc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #container {
            max-width: 480px;
            margin: 0 auto;
            background: #121212;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        #display {
            background: #000;
            border: 2px solid #ff8800;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(255,136,0,0.3);
        }
        #chDisp {
            font-size: 5rem;
            font-weight: bold;
            color: #ff8800;
            font-family: monospace;
            line-height: 1;
        }
        #mhzDisp {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin: 5px 0;
        }
        #statusLine {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            padding-top: 8px;
            margin-top: 5px;
        }
        #modeName { color: #00ff00; font-weight: bold; }
        #pttStat { color: #888; }
        
        /* Audio Spektrum */
        #audioBars {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 40px;
            background: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 2px 5px;
            margin-bottom: 15px;
        }
        .bar {
            width: 2.5%;
            background: #00ff00;
            transition: height 0.05s ease;
            height: 5%;
        }

        /* Tasten-Layout */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        
        button {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 5px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            width: 100%;
            box-sizing: border-box;
        }
        button:active {
            background: #ff8800 !important;
            color: #000 !important;
        }
        
        /* Spezial-Buttons */
        #pttBtn {
            background: #4a0000;
            border: 1px solid #a00;
            color: #ff9999;
            padding: 16px;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .btn-mumble { background: #1a252f; border-color: #34495e; color: #3498db; }
        .btn-hw { background: #2c3e50; border-color: #415b76; color: #ecf0f1; }
        
        /* Einstellungen */
        #settings {
            background: #181818;
            border: 1px solid #282828;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        #settings h3 { margin: 0 0 10px 0; font-size: 1rem; color: #ff8800; border-bottom: 1px solid #333; padding-bottom: 3px; }
        #settings p { margin: 6px 0; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], input[type="number"] {
            background: #000; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="container">
    <!-- Funkgeräte Display -->
    <div id="display">
        <div id="chDisp">01</div>
        <div id="mhzDisp">26.965 MHz</div>
        <div id="statusLine">
            <span id="modeName">FM</span>
            <span id="pttStat">○ RX IDLE</span>
        </div>
    </div>

    <!-- Audio Spektrum Balken -->
    <div id="audioBars"></div>

    <!-- PTT Sende-Taste -->
    <button id="pttBtn" onclick="sendCmd('P')">PTT TOGGLE</button>

    <!-- REIHE 1: Die Mumble Lebensadern -->
    <div class="grid-3">
        <button class="btn-mumble" onclick="sendCmd('VOLDOWN')">M-VOL -</button>
        <button class="btn-mumble" onclick="sendCmd('VOLUP')">M-VOL +</button>
        <button class="btn-mumble" onclick="sendCmd('S')">SYNC</button>
    </div>

    <!-- REIHE 2: Die 3er-Hauptreihe (Deine Wunsch-Anordnung!) -->
    <div class="grid-3">
        <button onclick="sendCmd('M')">MODE</button>
        <button onclick="sendCmd('HWVOX')">VOX (HW)</button>
        <button onclick="sendCmd('SSCAN')" id="scanBtn">S-SCAN</button>
    </div>

    <!-- REIHE 3: Die Erweiterungsreihe (FUNC LOCK ACTION) -->
    <div class="grid-3">
        <button class="btn-hw" onclick="sendCmd('HWFUNC')">FUNC</button>
        <button class="btn-hw" onclick="sendCmd('HWLOCK')">LOCK</button>
        <button class="btn-hw" onclick="sendCmd('HWACTION')">ACTION</button>
    </div>

    <!-- REIHE 4: Die nativen Funk-Regler (Squelch & Lautstärke) -->
    <div class="grid-4">
        <button class="btn-hw" onclick="sendCmd('SQDOWN')">SQ -</button>
        <button class="btn-hw" onclick="sendCmd('SQUP')">SQ +</button>
        <button class="btn-hw" onclick="sendCmd('HWVOLDOWN')">RAD -</button>
        <button class="btn-hw" onclick="sendCmd('HWVOLUP')">RAD +</button>
    </div>

    <!-- REIHE 5: Das neue, kompakte 3x4 Zahlenfeld (Kein langes Scrollen mehr!) -->
    <div class="grid-3" style="background: #151515; padding: 8px; border-radius: 8px; border: 1px solid #222;">
        <button onclick="sendCmd('K1')">1</button>
        <button onclick="sendCmd('K2')">2</button>
        <button onclick="sendCmd('K3')">3</button>
        <button onclick="sendCmd('K4')">4</button>
        <button onclick="sendCmd('K5')">5</button>
        <button onclick="sendCmd('K6')">6</button>
        <button onclick="sendCmd('K7')">7</button>
        <button onclick="sendCmd('K8')">8</button>
        <button onclick="sendCmd('K9')">9</button>
        <button onclick="sendCmd('KD')">DOWN</button>
        <button onclick="sendCmd('K0')">0</button>
        <button onclick="sendCmd('KU')">UP</button>
    </div>

    <!-- REIHE 6: Die programmierbaren P-Tasten -->
    <div class="grid-4" style="margin-top: 10px;">
        <button id="p1Btn" onclick="sendCmd('P1')">P1</button>
        <button id="p2Btn" onclick="sendCmd('P2')">P2</button>
        <button id="p3Btn" onclick="sendCmd('P3')">P3</button>
        <button id="p4Btn" onclick="sendCmd('P4')">P4</button>
    </div>

    <!-- Einstellungs-Menü -->
    <div id="settings">
        <h3>Remote Setup & Sync</h3>
        <p><span>Scan Geschwindigkeit (ms):</span> <input type="number" id="scanSpeedInput" onchange="sendCmd('SETSPEED_' + this.value)" style="width:70px;"></p>
        <p><label><input type="checkbox" id="skipPaCheck" onchange="sendCmd('SET_SKIP_PA?val=' + this.checked)"> PA Betriebsart überspringen</label></p>
        <p><label><input type="checkbox" id="skipCwCheck" onchange="sendCmd('SET_SKIP_CW?val=' + this.checked)"> CW Betriebsart überspringen</label></p>
        <p><span>FFT Gain Empfang (RX):</span> <input type="number" id="gainRxInput" onchange="sendCmd('SETGAIN_RX_0_' + this.value)" style="width:70px;"></p>
        <p><span>FFT Gain Senden (TX):</span> <input type="number" id="gainTxInput" onchange="sendCmd('SETGAIN_TX_0_' + this.value)" style="width:70px;"></p>
        <p><span>P1 Label:</span> <input type="text" id="p1Input" onchange="sendCmd('SET_P1_LABEL?val=' + this.value)" style="width:100px;"></p>
        <p><span>P2 Label:</span> <input type="text" id="p2Input" onchange="sendCmd('SET_P2_LABEL?val=' + this.value)" style="width:100px;"></p>
        <p><span>P3 Label:</span> <input type="text" id="p3Input" onchange="sendCmd('SET_P3_LABEL?val=' + this.value)" style="width:100px;"></p>
        <p><span>P4 Label:</span> <input type="text" id="p4Input" onchange="sendCmd('SET_P4_LABEL?val=' + this.value)" style="width:100px;"></p>
    </div>
</div>

<script>
    const freqs = {
        "01":"26.965","02":"26.975","03":"26.985","04":"27.005","05":"27.015",
        "06":"27.025","07":"27.035","08":"27.055","09":"27.065","10":"27.075",
        "11":"27.085","12":"27.105","13":"27.115","14":"27.125","15":"27.135",
        "16":"27.155","17":"27.165","18":"27.175","19":"27.185","20":"27.205",
        "21":"27.215","22":"27.225","23":"27.255","24":"27.235","25":"27.245",
        "26":"27.265","27":"27.275","28":"27.285","29":"27.295","30":"27.305",
        "31":"27.315","32":"27.325","33":"27.335","34":"27.345","35":"27.355",
        "36":"27.365","37":"27.375","38":"27.385","39":"27.395","40":"27.405"
    };

    // Erzeuge 32 Audio-Balken
    const barsContainer = document.getElementById('audioBars');
    for(let i=0; i<32; i++) {
        let bar = document.createElement('div');
        bar.className = 'bar';
        barsContainer.appendChild(bar);
    }

    let currentBarColor = 'green';

    function sendCmd(cmd) {
        fetch('/api/cmd/' + cmd)
            .then(res => res.json())
            .then(data => updateUI(data))
            .catch(err => console.error(err));
    }

    function updateUI(data) {
        if(!data) return;
        
        document.getElementById('chDisp').innerText = data.CH;
        document.getElementById('mhzDisp').innerText = (freqs[data.CH] || "---.---") + " MHz";
document.getElementById('modeName').innerText = data.MODE;
const btn = document.getElementById('pttBtn');
const stat = document.getElementById('pttStat');
if (data.PTT === "ON") {
currentBarColor = 'red';
btn.style.background = "#ff0000";
btn.innerText = "TX ACTIVE (" + data.REMAINING + "s)";
stat.innerText = "● TRANSMIT"; stat.style.color = "red";
} else if (data.VOX_TX) {
currentBarColor = 'orange';
btn.style.background = "#ff8800";
btn.innerText = "VOX TRANSMITTING";
stat.innerText = "● VOX ACTIVE"; stat.style.color = "#ff8800";
} else {
currentBarColor = 'green';
btn.style.background = "#4a0000";
btn.innerText = "PTT TOGGLE";
stat.innerText = data.BUSY ? "⚡ SIGNAL DETECTED" : "○ RX IDLE";
stat.style.color = data.BUSY ? "#00ff00" : "#444";
}
// Setup-Felder synchronisieren
if(data.SKIP_PA !== undefined) document.getElementById('skipPaCheck').checked = data.SKIP_PA;
if(data.SKIP_CW !== undefined) document.getElementById('skipCwCheck').checked = data.SKIP_CW;
// P-Tasten Beschriftungen aktualisieren
document.getElementById('p1Btn').innerText = data.P1_LABEL || "P1";
document.getElementById('p2Btn').innerText = data.P2_LABEL || "P2";
document.getElementById('p3Btn').innerText = data.P3_LABEL || "P3";
document.getElementById('p4Btn').innerText = data.P4_LABEL || "P4";
// Scan-Button färben falls aktiv
const scanBtn = document.getElementById('scanBtn');
scanBtn.style.background = data.SW_SCAN ? "#00ff00" : "";
scanBtn.style.color = data.SW_SCAN ? "#000" : "";
}
// Audio-Spektrum abfragen
setInterval(() => {
fetch('/api/audio')
.then(res => res.json())
.then(data => {
const bars = document.getElementsByClassName('bar');
for(let i=0; i<Math.min(data.length, bars.length); i++) {
let val = Math.max(5, Math.min(100, data[i] * 100));
bars[i].style.height = val + '%';
bars[i].style.background = currentBarColor;
}
}).catch(() => {});
}, 100);
// Initialen Status beim Laden holen
sendCmd('STATUS');
